[workspace]
resolver = "2"
members = [
    "noter-napi",
    "noter-bin",
    "crates/noter-core-api",
    "crates/noter-runtime",
    "crates/noter-search",
    "crates/noter-indexer",
    "crates/noter-symboldb",
    "crates/noter-treesitter",
    "crates/noter-git",
    "crates/noter-watcher",
    "crates/noter-diagnostics",
    "crates/noter-graph",
    "crates/noter-ai-context",
    "crates/noter-ext-host",
    "crates/noter-scheduler",
    "crates/noter-cache",
    "crates/noter-project-engine",
    "crates/noter-index-engine",
    "crates/noter-watch-engine",
    "crates/noter-code-graph",
    "crates/noter-symbol-intelligence",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Ravi Kumar <ravikumarcyberworld@gmail.com>"]
license = "MIT"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
# Parallel processing
rayon = "1"
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Error handling
anyhow = "1"
thiserror = "1"
# Logging
tracing = "0.1"
tracing-subscriber = "0.3"
# Cross-crate channels
crossbeam-channel = "0.5"
# IPC with Electron
napi = { version = "2", features = ["napi4"] }
napi-derive = "2"
# LSP protocol types (boundary-only — convert to noter-core-api types immediately)
lsp-types = "0.95"
# Async trait support
async-trait = "0.1"
# Stable unique IDs for symbols (v5 = deterministic from content hash)
uuid = { version = "1", features = ["v5", "serde"] }
# Project engine — directory walking + TOML manifest parsing
walkdir = "2"
toml = "0.8"
# Code graph — directed graph with stable indices (for incremental node removal)
petgraph = { version = "0.6", features = ["serde-1"] }
# Import/export pattern extraction from source files
regex = "1"
# Lazy regex compilation (zero-cost on subsequent calls)
once_cell = "1"
